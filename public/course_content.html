<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Content - Training Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Helvetica', 'Arial', sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; }
        .course-header { background: linear-gradient(135deg, #44749f 0%, #1e293b 100%); padding: 60px 80px; color: white; }
        .back-link { color: rgba(255,255,255,0.7); text-decoration: none; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .back-link:hover { color: white; }
        
        .course-info h1 { margin: 0; font-size: 2.2rem; color: #cf9c33; }
        .course-info p { margin: 10px 0 0 0; font-size: 1rem; opacity: 0.8; max-width: 700px; line-height: 1.6; }
        
        .main-content { padding: 40px 80px; max-width: 1000px; margin: 0 auto; }
        .section-title { font-size: 1.4rem; color: #1e293b; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        
        .module-item { background: white; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; overflow: hidden; }
        .empty-state { text-align: center; padding: 100px; background: white; border-radius: 12px; border: 1px dashed #cbd5e1; }
        
        /* New Grid Styles */
        .modules-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 20px 0; }
        .module-card { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s, opacity 0.3s, filter 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #1e293b; }
        .module-card:hover { transform: scale(1.05); z-index: 10; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .module-card.module-card-locked { cursor: not-allowed; opacity: 0.52; filter: grayscale(0.35); }
        .module-card.module-card-locked:hover { transform: none; z-index: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .module-cover { position: absolute; inset: 0; background-size: cover; background-position: center; transition: 0.3s; opacity: 1.0; }
        .module-card:hover .module-cover { opacity: 0.8; transform: scale(1.05); }
        .module-card.module-card-locked:hover .module-cover { opacity: 1; transform: none; }
        .module-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; color: white; transition: 0.3s; }
        .module-card:hover .module-overlay { background: rgba(0,0,0,0.2); justify-content: flex-start; padding-top: 30px; }
        .module-card.module-card-locked .module-overlay { background: linear-gradient(to bottom, rgba(15,23,42,0.65) 0%, rgba(15,23,42,0.35) 45%, rgba(15,23,42,0.9) 100%); }
        .module-card.module-card-locked:hover .module-overlay { justify-content: space-between; padding-top: 20px; }
        .module-title { margin: 0; font-size: 1.3rem; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.8); transition: 0.3s; }
        .module-card:hover .module-title { margin-bottom: 15px; color: #cf9c33; }
        .module-card.module-card-locked:hover .module-title { margin-bottom: 0; color: inherit; }
        .module-desc { margin: 0; font-size: 0.95rem; opacity: 0; transform: translateY(20px); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 3px rgba(0,0,0,0.8); line-height: 1.5; }
        .module-card:hover .module-desc { opacity: 1; transform: translateY(0); }
        .module-card.module-card-locked .module-desc { opacity: 1; transform: none; -webkit-line-clamp: 3; }
        .module-status-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; background: rgba(15,23,42,0.82); border: 1px solid rgba(255,255,255,0.24); color: #f8fafc; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.01em; backdrop-filter: blur(4px); }
        .module-status-badge.waiting { background: rgba(207,156,51,0.92); color: #111827; border-color: rgba(255,255,255,0.35); }
        
        /* Custom Design Container */
        #custom-design-container { width: 100%; display: flex; flex-direction: column; min-height: 100vh; }
        #custom-design-container .module-section { position: relative; }
        #custom-design-container .module-content { max-width: 100% !important; padding-left: 40px !important; padding-right: 40px !important; }
    </style>
</head>
<body class="view-mode">

    <div id="course-content-root">
        <!-- Content injected by JS -->
    </div>

    <script>
        function toggleModule(id) {
            const content = document.getElementById('content-' + id);
            const icon = document.getElementById('icon-' + id);
            const isVisible = content.style.display === 'block';
            
            content.style.display = isVisible ? 'none' : 'block';
            icon.style.transform = isVisible ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('id');
            const container = document.getElementById('course-content-root');

            if (!courseId) {
                container.innerHTML = '<div class="empty-state">Course ID not found.</div>';
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html?redirect=' + encodeURIComponent('/course_content.html?id=' + courseId);
                return;
            }

            Promise.all([
                fetch(`/api/profile/me`, { headers: { 'Authorization': `Bearer ${token}` } }).then(res => res.json()),
                fetch(`/courses/${courseId}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(res => {
                    if (!res.ok) throw new Error('Course not found');
                    return res.json();
                })
            ])
            .then(([profileData, courseData]) => {
                const actualProfileData = profileData.data || profileData;
                const currentUser = actualProfileData.user || {};
                const course = courseData.data || courseData;
                
                if (!course) {
                    container.innerHTML = '<div class="empty-state">Course not found.</div>';
                    return;
                }

                const isOwnerOrEditor = course.canManage === true;

                // Handle modules format from DB or Local
                const rawModules = course.modules || (course.courseModules ? course.courseModules.map(cm => cm.module) : []);
                const modules = rawModules.map((m, i) => {
                    const status = m.moduleStatus || m.status || 'DRAFT';
                    return {
                        id: m.id || m.moduleId,
                        title: m.title || `Module ${i+1}`,
                        content: m.description || m.content || 'No description available for this module.',
                        coverImage: m.coverImage || 'https://images.unsplash.com/photo-1557682250-33bd709cbe85?auto=format&fit=crop&q=80&w=800',
                        titleFont: m.titleFont || 'inherit',
                        textColor: m.textColor || '#ffffff',
                        status,
                        isPublished: status === 'PUBLISHED',
                        isLockedForStudent: !isOwnerOrEditor && status !== 'PUBLISHED',
                        videos: m.videos || [],
                        documents: m.documents || [],
                        quizzes: m.quizzes || []
                    };
                });

                let modulesHTML = '';
                if (modules.length === 0) {
                    modulesHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <i class="fas fa-book-open" style="font-size: 3rem; color: #e2e8f0; margin-bottom: 20px; display: block;"></i>
                            <p style="color: #64748b;">This course does not have content modules yet.</p>
                            <a href="course_builder.html?id=${course.id}" style="color: #cf9c33; font-weight: bold; text-decoration: none;">Add modules now</a>
                        </div>
                    `;
                } else {
                    modulesHTML = `<div class="modules-grid" style="grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; width: 100%;">`;
                    modules.forEach(m => {
                        const lockedMessage = 'Waiting to be published';
                        const cardClass = m.isLockedForStudent ? 'module-card module-card-locked' : 'module-card';
                        const clickHandler = m.isLockedForStudent
                            ? `event.preventDefault(); event.stopPropagation();`
                            : `window.location.href='module_viewer.html?moduleId=${m.id}&courseId=${course.id}'`;
                        const statusBadge = m.isLockedForStudent
                            ? `<div class="module-status-badge waiting"><i class="fas fa-clock"></i> ${lockedMessage}</div>`
                            : (!m.isPublished && isOwnerOrEditor ? `<div class="module-status-badge"><i class="fas fa-eye-slash"></i> Draft</div>` : '');

                        modulesHTML += `
                            <div class="${cardClass}" onclick="${clickHandler}" aria-disabled="${m.isLockedForStudent ? 'true' : 'false'}" title="${m.isLockedForStudent ? lockedMessage : 'Open module'}">
                                <div class="module-cover" style="background-image: url('${m.coverImage}');"></div>
                                <div class="module-overlay">
                                    ${statusBadge}
                                    <h3 class="module-title" style="font-family: ${m.titleFont}; color: ${m.textColor};">${m.title}</h3>
                                    <p class="module-desc">${m.isLockedForStudent ? 'This module is not available yet.' : m.content}</p>
                                    <div style="display:flex; gap:10px; margin-top:auto; font-size:0.85rem; color:rgba(255,255,255,0.7); padding-top:15px;">
                                        <span title="Videos"><i class="fas fa-video"></i> ${m.videos ? m.videos.length : 0}</span>
                                        <span title="Documents"><i class="fas fa-file-alt"></i> ${m.documents ? m.documents.length : 0}</span>
                                        <span title="Quizzes"><i class="fas fa-question-circle"></i> ${m.quizzes ? m.quizzes.length : 0}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    modulesHTML += `</div>`;
                }

                // Inject custom CSS if exists
                if (course.contentCss) {
                    const style = document.createElement('style');
                    style.innerHTML = course.contentCss;
                    document.head.appendChild(style);
                }

                const editSettingsButtonHTML = isOwnerOrEditor ? `
                    <div style="position: absolute; right: 20px; top: 20px; z-index: 100;">
                        <button onclick="window.location.href='content_builder.html?courseId=${course.id}'" style="background:rgba(255,255,255,0.2); color:white; border:none; padding:8px 15px; border-radius:30px; cursor:pointer; font-weight:bold; transition:0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);" onmouseover="this.style.background='white'; this.style.color='#1e293b'" onmouseout="this.style.background='rgba(255,255,255,0.2)'; this.style.color='white'"><i class="fas fa-edit"></i> Edit Settings</button>
                    </div>
                ` : '';

                // If the course has a custom design, use it and append modules at the bottom
                if (course.contentHtml) {
                    let finalHtml = course.contentHtml;
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = finalHtml;
                    
                    const modSec = tempDiv.querySelector('#course-modules-section');
                    const coursesPlaceholder = tempDiv.querySelector('#courses-placeholder');
                    
                    if (coursesPlaceholder) {
                        coursesPlaceholder.style.display = 'block';
                        coursesPlaceholder.style.padding = '0';
                        coursesPlaceholder.style.border = 'none';
                        coursesPlaceholder.style.background = 'transparent';
                        coursesPlaceholder.innerHTML = modulesHTML;
                        
                        // Setup placeholders for AI fetching
                        const statsBlock = tempDiv.querySelector('.stat-block h3');
                        if (statsBlock) {
                            statsBlock.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                            const p = statsBlock.nextElementSibling;
                            if (p) p.innerText = 'Calculating AI Insights...';
                        }
                        
                        finalHtml = tempDiv.innerHTML;
                    } else {
                        const modsPlac = tempDiv.querySelector('#modules-placeholder');
                        if (modsPlac) {
                            modsPlac.innerHTML = modulesHTML;
                            finalHtml = tempDiv.innerHTML;
                        } else if (modSec) {
                            modSec.style.flex = "1";
                            modSec.innerHTML = `
                                <div style="width: 100%; max-width: 1200px; margin: 0 auto;">
                                    <h2 style="color: #1e293b; display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                                        <i class="fas fa-th-large" style="color: #cf9c33;"></i> Course Modules 
                                    </h2>
                                    ${modulesHTML}
                                </div>
                            `;
                            finalHtml = tempDiv.innerHTML;
                        } else {
                            finalHtml += `
                                <main class="main-content" style="max-width: 1200px; margin: 40px auto; padding: 0 40px;">
                                    <h2 class="section-title"><i class="fas fa-th-large" style="color: #cf9c33;"></i> Course Modules</h2>
                                    ${modulesHTML}
                                </main>
                            `;
                        }
                    }
                    
                    container.innerHTML = `
                        <div id="custom-design-container">
                            <div style="position: absolute; left: 20px; top: 20px; z-index: 100;">
                                <button onclick="window.location.href='profile.html?tab=creations'" style="background:rgba(0,0,0,0.5); color:white; border:1px solid rgba(255,255,255,0.2); padding:8px 15px; border-radius:30px; cursor:pointer; font-weight:bold; transition:0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); backdrop-filter: blur(5px);" onmouseover="this.style.background='rgba(255,255,255,0.2)'; this.style.color='white'" onmouseout="this.style.background='rgba(0,0,0,0.5)'; this.style.color='white'"><i class="fas fa-arrow-left"></i> Back</button>
                            </div>
                            ${editSettingsButtonHTML}
                            ${finalHtml}
                        </div>
                    `;
                } else {                     // Fallback to default template layout (AGENFOR layout)
                    container.innerHTML = `
                        <div id="custom-design-container" style="font-family: 'Inter', sans-serif; background-color: #f8fafc; min-height: 100vh;">
                            <div style="position: absolute; left: 20px; top: 20px; z-index: 100;">
                                <button onclick="window.location.href='profile.html?tab=creations'" style="background:rgba(0,0,0,0.5); color:white; border:1px solid rgba(255,255,255,0.2); padding:8px 15px; border-radius:30px; cursor:pointer; font-weight:bold; transition:0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); backdrop-filter: blur(5px);" onmouseover="this.style.background='rgba(255,255,255,0.2)'; this.style.color='white'" onmouseout="this.style.background='rgba(0,0,0,0.5)'; this.style.color='white'"><i class="fas fa-arrow-left"></i> Back</button>
                            </div>
                            ${editSettingsButtonHTML}
                            
                            <!-- Nav -->
                            <nav style="background-color: #cf9c33; padding: 15px 40px; display: flex; align-items: center; justify-content: flex-end; height: 60px;">
                                <div style="position: absolute; left: 40px; display:flex; align-items:center; gap:15px; color:white; font-weight:bold; font-size:1.2rem;">
                                    <i class="fas fa-globe"></i> AGENFOR
                                </div>
                            </nav>
                            
                            <!-- Header -->
                            <header style="background: white; padding: 60px 40px; border-bottom: 1px solid #e2e8f0;">
                                <div style="max-width: 1200px; margin: 0 auto;">
                                    <h1 style="color: #1e293b; font-size: 2.8rem; margin: 0; font-weight: 800;">${course.title || 'Advanced Virtual Academy'}</h1>
                                    <h2 style="color: #cf9c33; font-size: 1.5rem; margin: 10px 0;">Subtitle</h2>
                                    <p style="color: #64748b; font-size: 1.1rem; max-width: 800px; line-height: 1.6; font-weight: 600;">${course.description || "To deliver trainings in a virtual ecosystem to empower public institutions, organisations and professionals with the skills and expertise needed to navigate today's complex challenges."}</p>
                                </div>
                            </header>

                            <!-- Main Content -->
                            <main style="max-width: 1200px; margin: 0 auto; padding: 40px;">
                                <div style="display: flex; gap: 40px; flex-wrap: wrap;">
                                    <!-- Modules Grid -->
                                    <div style="flex: 3; min-width: 300px;">
                                        <h2 style="color: #1e293b; display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                                            <i class="fas fa-layer-group" style="color: #cf9c33;"></i> Módulos do Curso
                                        </h2>
                                        ${modulesHTML}
                                    </div>
                                    
                                    <!-- Sidebar: 6-Step Journey -->
                                    <div style="flex: 1; min-width: 300px;">
                                        <div style="border: 2px dashed #cbd5e1; border-radius: 12px; padding: 25px; background: rgba(255, 255, 255, 0.6);">
                                            <h3 style="color: #0ea5e9; margin-top: 0; font-size: 1.3rem; font-weight: 800; margin-bottom: 20px;">A 6-Step Learning Journey</h3>
                                            <div style="display: flex; flex-direction: column; gap: 15px; color: #334155; font-size: 0.9rem; font-weight: 500;">
                                                
                                                <div style="border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; background: white;">
                                                    <span><strong>Step 1:</strong> Entry Test – A quick assessment to evaluate your initial knowledge before starting.</span>
                                                </div>
                                                
                                                <div style="border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; background: white;">
                                                    <span><strong>Step 2:</strong> Video Lessons – Expert-led sessions (30 minutes each) diving deep into technical sub-topics.</span>
                                                </div>
                                                
                                                <div style="border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; background: white;">
                                                    <span><strong>Step 3:</strong> Training material – Downloadable resources covering the main aspects and essential data.</span>
                                                </div>
                                                
                                                <div style="border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; background: white;">
                                                    <span><strong>Step 4:</strong> Interactive Simulation – Apply your skills to real-life case studies and operational scenarios.</span>
                                                </div>
                                                
                                                <div style="border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; background: white;">
                                                    <span><strong>Step 5:</strong> AI Avatar Support – Our closed-circuit Avatar for instant clarifications on legislation and manuals.</span>
                                                </div>
                                                
                                                <div style="border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; background: white;">
                                                    <span><strong>Step 6:</strong> Final Evaluation – Test your acquired skills to successfully complete the training module.</span>
                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </main>

                            <!-- Footer -->
                            <footer style="background: linear-gradient(to right, #1e293b 0%, #cf9c33 100%); padding: 40px; color: white; margin-top: 40px;">
                                <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 40px;">
                                    <div style="flex: 1; min-width: 250px;">
                                        <h3 style="color: white; margin-top: 0; font-size:1.2rem;">Sobre Nós</h3>
                                        <p style="font-size: 0.9rem; opacity: 0.9; line-height:1.6;">Somos uma instituição dedicada a entregar o melhor conteúdo educacional. Nosso foco é democratizar o conhecimento através da tecnologia aberta.</p>
                                    </div>
                                    <div style="flex: 1; min-width: 250px;">
                                        <h3 style="color: white; margin-top: 0; font-size:1.2rem;">Contato</h3>
                                        <p style="font-size: 0.9rem; opacity: 0.9; line-height:1.6;">Email: contato@exemplo.com<br>Telefone: (11) 9999-9999<br>Endereço: Avenida Principal, 1000 - Centro</p>
                                    </div>
                                    <div style="flex: 1; min-width: 250px;">
                                        <h3 style="color: white; margin-top: 0; font-size:1.2rem;">Parceiros</h3>
                                        <div style="display: flex; gap: 10px;">
                                            <div style="background: white; padding: 8px 20px; border-radius: 4px; color: #1e293b; font-weight: bold; font-size: 0.8rem;">Logo 1</div>
                                            <div style="background: white; padding: 8px 20px; border-radius: 4px; color: #1e293b; font-weight: bold; font-size: 0.8rem;">Logo 2</div>
                                            <div style="background: white; padding: 8px 20px; border-radius: 4px; color: #1e293b; font-weight: bold; font-size: 0.8rem;">Logo 3</div>
                                        </div>
                                    </div>
                                </div>
                            </footer>
                        </div>
                    `;
                }

                // Fetch AI Insights dynamically after rendering
                if (course.contentHtml && course.contentHtml.includes('courses-placeholder')) {
                    fetch(`/api/courses/${courseId}/insights`, { headers: { 'Authorization': `Bearer ${token}` } })
                    .then(res => res.json())
                    .then(insights => {
                        // Update Performance Dashboard
                        const statBlocks = document.querySelectorAll('#custom-design-container .stat-block');
                        if (statBlocks.length > 0 && insights.stats) {
                            statBlocks[0].innerHTML = `
                                <h3 style="margin:0; font-size:1.8rem; color:#cf9c33;">${insights.stats.completedModules}</h3>
                                <p style="margin:5px 0 0 0; font-size:0.9rem; opacity:0.8;">Módulos Concluídos</p>
                            `;
                        }
                        if (statBlocks.length > 1 && insights.stats) {
                            statBlocks[1].innerHTML = `
                                <h3 style="margin:0; font-size:1.8rem; color:#cf9c33;">${insights.stats.averageScore}</h3>
                                <p style="margin:5px 0 0 0; font-size:0.9rem; opacity:0.8;">Média de Notas - ${insights.stats.status}</p>
                            `;
                        }

                        // Update tasks list if it exists
                        const tasksList = document.querySelector('#custom-design-container #ai-tasks-list');
                        if (tasksList && insights.reminders) {
                            tasksList.innerHTML = insights.reminders.map(r => `
                                <li style="display:flex; align-items:flex-start; gap:10px;">
                                    <i class="fas fa-exclamation-circle" style="color:#cf9c33; margin-top:3px;"></i>
                                    <div><p style="margin:0; font-size:0.9rem;">${r}</p></div>
                                </li>
                            `).join('');
                        }

                        // Update News / Tips
                        const newsContainer = document.querySelectorAll('#custom-design-container .glass-panel')[2];
                        if (newsContainer && insights.news) {
                            const newsHTML = insights.news.map(n => `
                                <div style="border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
                                    <span style="font-size:0.75rem; color:#cf9c33;">${n.date}</span>
                                    <p style="margin:5px 0 0 0; font-size:0.9rem;">${n.title}</p>
                                </div>
                            `).join('');
                            
                            // Replace existing news items keeping the title intact
                            const titleHtml = `<h3 style="margin-top:0; color:#cf9c33; font-size:1.1rem; margin-bottom:15px; display:flex; align-items:center; gap:8px;"><i class="fas fa-bullhorn"></i> Dicas da IA</h3>`;
                            newsContainer.innerHTML = titleHtml + `<div style="display:flex; flex-direction:column; gap:15px;">${newsHTML}</div>`;
                        }
                    })
                    .catch(err => console.error("Failed to fetch AI Insights", err));
                }
            })
            .catch(err => {
                // Tenta carregar do localStorage como fallback para testes antigos
                const courses = JSON.parse(localStorage.getItem('published_courses') || '[]');
                const course = courses.find(c => String(c.id) === String(courseId));
                
                if (course) {
                    // Copiar o mesmo código de renderização do then(...)
                        const modules = course.modules || [];
                        let modulesHTML = '';
                        if (modules.length === 0) {
                            modulesHTML = `
                                <div class="empty-state" style="grid-column: 1 / -1;">
                                    <i class="fas fa-book-open" style="font-size: 3rem; color: #e2e8f0; margin-bottom: 20px; display: block;"></i>
                                    <p style="color: #64748b;">This course does not have content modules yet.</p>
                                    <a href="course_builder.html?id=${course.id}" style="color: #cf9c33; font-weight: bold; text-decoration: none;">Add modules now</a>
                                </div>
                            `;
                        } else {
                            modulesHTML = `<div class="modules-grid">`;
                            modules.forEach((m, i) => {
                                const mTitle = m.title || `Module ${i+1}`;
                                const mDesc = m.description || m.content || 'No description';
                                const mCover = m.coverImage || 'https://images.unsplash.com/photo-1557682250-33bd709cbe85?auto=format&fit=crop&q=80&w=800';
                                modulesHTML += `
                                    <div class="module-card">
                                        <div class="module-cover" style="background-image: url('${mCover}');"></div>
                                        <div class="module-overlay">
                                            <h3 class="module-title">${mTitle}</h3>
                                            <p class="module-desc">${mDesc}</p>
                                            <div style="display:flex; gap:10px; margin-top:auto; font-size:0.85rem; color:rgba(255,255,255,0.7); padding-top:15px;">
                                                <span title="Videos"><i class="fas fa-video"></i> ${m.videos ? m.videos.length : 0}</span>
                                                <span title="Documents"><i class="fas fa-file-alt"></i> ${m.documents ? m.documents.length : 0}</span>
                                                <span title="Quizzes"><i class="fas fa-question-circle"></i> ${m.quizzes ? m.quizzes.length : 0}</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            });
                            modulesHTML += `</div>`;
                        }
                        container.innerHTML = `
                        <header class="course-header" style="display:flex; justify-content:space-between; align-items:center;">
                            <div style="flex:1;">
                                <a href="profile.html?tab=creations" class="back-link"><i class="fas fa-arrow-left"></i> Back to my creations</a>
                                <div class="course-info">
                                    <h1>${course.title} (Local)</h1>
                                    <p>${course.description || 'This course offers structured content for your professional development.'}</p>
                                </div>
                            </div>
                            <button onclick="window.location.href='course_builder.html?id=${course.id}'" style="display:${isOwnerOrEditor ? 'flex' : 'none'}; background:rgba(255,255,255,0.2); color:white; border:1px solid rgba(255,255,255,0.4); padding:12px 25px; border-radius:30px; font-weight:bold; cursor:pointer; align-items:center; gap:10px; transition:0.3s;">
                                <i class="fas fa-edit"></i> Edit Course
                            </button>
                        </header>
                        <main class="main-content">
                            <h2 class="section-title"><i class="fas fa-list-ul" style="color: #cf9c33;"></i> Course Content (${modules.length} modules)</h2>
                            ${modulesHTML}
                        </main>
                    `;
                } else {
                    container.innerHTML = '<div class="empty-state">Course not found (API failed and not in Local Storage).</div>';
                }
            });
        });
    </script>
</body>
</html>
