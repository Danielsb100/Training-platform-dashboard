<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewing Page</title>
    <!-- We link style.css so the landing page styles work correctly -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Floating Home Button specific to Viewer */
        .viewer-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(15, 23, 42, 0.85);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, background-color 0.2s;
        }
        .viewer-home-btn:hover {
            transform: scale(1.1);
            background-color: rgba(79, 70, 229, 0.9);
        }
        
        /* Ensure the viewer body handles the injected content smoothly */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Default dark bg just in case */
        }

        #page-content {
            min-height: 100vh;
        }

        /* Enrollment Request Modal */
        .enrollment-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .enrollment-modal {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: modalSlideUp 0.3s ease;
        }
        @keyframes modalSlideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .enrollment-modal .modal-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.8rem;
        }
        .enrollment-modal .modal-icon.locked {
            background: #fef3c7;
            color: #d97706;
        }
        .enrollment-modal .modal-icon.success {
            background: #d1fae5;
            color: #059669;
        }
        .enrollment-modal .modal-icon.pending {
            background: #e0e7ff;
            color: #4f46e5;
        }
        .enrollment-modal h2 {
            margin: 0 0 12px;
            color: #1e293b;
            font-size: 1.5rem;
        }
        .enrollment-modal p {
            margin: 0 0 25px;
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
        }
        .enrollment-modal .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .enrollment-modal .btn-request {
            background: linear-gradient(135deg, #cf982e, #b8860b);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .enrollment-modal .btn-request:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(207, 152, 46, 0.4);
        }
        .enrollment-modal .btn-request:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .enrollment-modal .btn-close-modal {
            background: #f1f5f9;
            color: #475569;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .enrollment-modal .btn-close-modal:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body class="view-mode">
    
    <a href="marketplace.html" class="viewer-home-btn" title="Back to Home">
        <i class="fas fa-home"></i>
    </a>
    <div id="page-content">
        <!-- Content will be injected here -->
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; color:white;">
            <h2 data-i18n="viewer.loadingPage">Loading page...</h2>
        </div>
    </div>

    <div id="access-training-cta" style="display: none; background: #0f172a; padding: 40px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto;">
        <button id="btn-access-training" style="background: linear-gradient(90deg, #cf982e, #b8860b); color: white; border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;" data-i18n="viewer.accessTheExercise">
            Access the Exercise
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pageId = urlParams.get('id');

            if (!pageId) {
                document.getElementById('page-content').innerHTML = '<div style="display:flex; justify-content:center; align-items:center; height:100vh; color:white;"><h2>Page not found (No ID provided).</h2></div>';
                return;
            }

            // Setup Access Training Button
            const accessTrainingCta = document.getElementById('access-training-cta');
            const btnAccessTraining = document.getElementById('btn-access-training');
            if (accessTrainingCta && btnAccessTraining) {
                accessTrainingCta.style.display = 'block';
                btnAccessTraining.addEventListener('click', () => {
                    handleCourseAccess(pageId);
                });
            }

            function loadFromLocalStorage() {
                const courses = JSON.parse(localStorage.getItem('published_courses') || '[]');
                const pages = JSON.parse(localStorage.getItem('published_pages') || '[]');
                
                let page = courses.find(c => c.id === pageId) || pages.find(p => p.id === pageId);

                if (page) {
                    document.title = page.title || 'Course';
                    const contentHtml = page.compiled_content || page.modular_content || page.content;
                    
                    if (contentHtml) {
                        document.getElementById('page-content').innerHTML = contentHtml;
                        initializeAnimations();
                        injectInlineAccessTraining();
                    } else {
                        window.location.href = 'course_content.html?id=' + pageId;
                    }
                } else {
                    window.location.href = 'course_content.html?id=' + pageId;
                }
            }

            function showNoLandingPage() {
                window.location.href = 'course_content.html?id=' + pageId;
            }

            function initializeAnimations() {
                const animObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if(entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                        } else {
                            entry.target.classList.remove('is-visible');
                        }
                    });
                }, { threshold: 0.1 });
                
                document.querySelectorAll('.anim-fade-in, .anim-slide-up').forEach(el => {
                    animObserver.observe(el);
                });
                // Buttons will be handled by document event delegation to ensure they always fire.
            }

            // Inject an inline Access Training button near existing CTAs inside the rendered content
            function injectInlineAccessTraining() {
                // Prevent duplicate injection
                if (document.querySelector('[data-access-training-inline="true"]')) return;

                const content = document.getElementById('page-content');
                if (!content) return;

                // Remove the SUBSCRIBE button from the Guided Exercise section if present
                const guidedSection = content.querySelector('#ipt-exercise-section');
                if (guidedSection) {
                    const subBtn = guidedSection.querySelector('.btn-subscribe, [data-is-subscribe-btn="true"]');
                    if (subBtn) subBtn.remove();
                }

                // Find the best anchor: subscribe area, view-modules btn, subscribe btn, or any prominent CTA
                let anchor = content.querySelector('.ipt-exercise-subscribe-area');
                if (!anchor) {
                    const fallbacks = content.querySelectorAll('[data-is-view-modules-btn="true"], [data-is-subscribe-btn="true"], .btn-subscribe');
                    for (let f of fallbacks) {
                        if (!f.closest('footer') && !f.closest('.footer')) {
                            anchor = f;
                            break;
                        }
                    }
                }

                if (!anchor) return; // No suitable CTA found; bottom fallback remains

                const inlineBtn = document.createElement('button');
                inlineBtn.setAttribute('data-access-training-inline', 'true');
                inlineBtn.textContent = 'Access Training';
                inlineBtn.style.cssText = 'background: linear-gradient(90deg, #cf982e, #b8860b); color: white; border: none; padding: 15px 40px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-left: 12px; vertical-align: middle;';
                inlineBtn.addEventListener('mouseenter', function() { this.style.transform = 'translateY(-2px)'; this.style.boxShadow = '0 5px 15px rgba(207,152,46,0.4)'; });
                inlineBtn.addEventListener('mouseleave', function() { this.style.transform = 'none'; this.style.boxShadow = 'none'; });
                inlineBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    handleCourseAccess(pageId);
                });

                // Insert after or inside the anchor element
                if (anchor.classList.contains('ipt-exercise-subscribe-area')) {
                    inlineBtn.style.marginLeft = '0';
                    anchor.appendChild(inlineBtn);
                } else if (anchor.parentNode) {
                    anchor.parentNode.insertBefore(inlineBtn, anchor.nextSibling);
                }
            }
            
            document.addEventListener('click', async (e) => {
                const viewBtn = e.target.closest('[data-is-view-modules-btn="true"]');
                if (viewBtn) {
                    e.preventDefault();
                    e.stopPropagation();
                    handleCourseAccess(pageId);
                    return;
                }
                
                const subBtn = e.target.closest('.btn-subscribe, [data-is-subscribe-btn="true"]');
                if (subBtn) {
                    e.preventDefault();
                    e.stopPropagation();
                    handleCourseAccess(pageId);
                    return;
                }

                // --- YouTube Video Play in View Mode ---
                const ytPlay = e.target.closest('.ipt-yt-play, .ipt-yt-placeholder');
                if (ytPlay) {
                    const container = ytPlay.closest('.ipt-yt-container');
                    if (!container) return;
                    const ytUrl = container.dataset.ytUrl || '';
                    if (!ytUrl) return;

                    let videoId = '';
                    try {
                        const urlObj = new URL(ytUrl);
                        if (urlObj.hostname.includes('youtu.be')) {
                            videoId = urlObj.pathname.slice(1);
                        } else if (urlObj.searchParams.get('v')) {
                            videoId = urlObj.searchParams.get('v');
                        }
                    } catch(err) {
                        videoId = ytUrl;
                    }

                    if (videoId) {
                        const placeholder = container.querySelector('.ipt-yt-placeholder');
                        const iframeWrap = container.querySelector('.ipt-yt-iframe-wrap');
                        if (placeholder) placeholder.style.display = 'none';
                        if (iframeWrap) {
                            iframeWrap.style.display = 'block';
                            iframeWrap.innerHTML = '<iframe width="100%" height="100%" src="https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%;height:100%;border-radius:10px;"></iframe>';
                        }
                    }
                }
            });

            fetch(`/api/landing-pages/course/${pageId}`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error('API_ERROR');
                    }
                    return res.json();
                })
                .then(page => {
                    document.title = page.title || 'Course';
                    
                    if (page.compiledCss) {
                        const style = document.createElement('style');
                        style.textContent = page.compiledCss;
                        document.head.appendChild(style);
                    }
                    
                    const contentHtml = page.compiledHtml;
                    
                    if (contentHtml) {
                        document.getElementById('page-content').innerHTML = contentHtml;
                        initializeAnimations();
                        injectInlineAccessTraining();
                    } else {
                        loadFromLocalStorage();
                    }
                })
                .catch(err => {
                    // Fallback to localStorage if API fails or 404
                    loadFromLocalStorage();
                });

            // --- Enrollment Request Modal Logic ---
            async function handleCourseAccess(courseId) {
                const token = localStorage.getItem('token');
                if (!token) {
                    // Redirect back to viewer.html (this page) after login, NOT course_content.html.
                    // The viewer already has the enrollment modal to handle non-enrolled users.
                    const returnUrl = '/viewer.html?id=' + courseId;
                    window.location.href = '/login.html?redirect=' + encodeURIComponent(returnUrl);
                    return;
                }

                try {
                    const res = await fetch('/courses/' + courseId, {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });

                    if (res.ok) {
                        // User has access — redirect normally
                        window.location.href = '/course_content.html?id=' + courseId;
                        return;
                    }

                    if (res.status === 401) {
                        // Token invalid or expired — force re-login
                        localStorage.removeItem('token');
                        const returnUrl = '/viewer.html?id=' + courseId;
                        window.location.href = '/login.html?redirect=' + encodeURIComponent(returnUrl);
                        return;
                    }

                    if (res.status === 403) {
                        // No access — show enrollment request modal
                        showEnrollmentModal(courseId);
                        return;
                    }

                    // Other errors (404 etc)
                    showEnrollmentModal(courseId, 'error');
                } catch (err) {
                    console.error('Access check failed:', err);
                    showEnrollmentModal(courseId, 'error');
                }
            }

            function showEnrollmentModal(courseId, mode) {
                // Remove existing modal if any
                const existing = document.getElementById('enrollment-request-modal');
                if (existing) existing.remove();

                const overlay = document.createElement('div');
                overlay.id = 'enrollment-request-modal';
                overlay.className = 'enrollment-modal-overlay';

                if (mode === 'error') {
                    overlay.innerHTML = `
                        <div class="enrollment-modal">
                            <div class="modal-icon locked"><i class="fas fa-exclamation-triangle"></i></div>
                            <h2>Course Unavailable</h2>
                            <p>This course could not be found or is currently unavailable. Please try again later.</p>
                            <div class="modal-actions">
                                <button class="btn-close-modal" onclick="this.closest('.enrollment-modal-overlay').remove()">Close</button>
                            </div>
                        </div>
                    `;
                } else {
                    overlay.innerHTML = `
                        <div class="enrollment-modal">
                            <div class="modal-icon locked"><i class="fas fa-lock"></i></div>
                            <h2>Access Restricted</h2>
                            <p>You are not enrolled in this course. Request enrollment and the instructor will review your application.</p>
                            <div class="modal-actions">
                                <button class="btn-close-modal" onclick="this.closest('.enrollment-modal-overlay').remove()">Cancel</button>
                                <button class="btn-request" id="btn-request-enrollment"><i class="fas fa-paper-plane" style="margin-right:8px;"></i>Request Enrollment</button>
                            </div>
                        </div>
                    `;
                }

                document.body.appendChild(overlay);

                // Close on overlay click (outside modal)
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.remove();
                });

                // Bind request button
                const requestBtn = document.getElementById('btn-request-enrollment');
                if (requestBtn) {
                    requestBtn.addEventListener('click', async () => {
                        requestBtn.disabled = true;
                        requestBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Sending...';

                        try {
                            const token = localStorage.getItem('token');
                            const res = await fetch('/api/courses/' + courseId + '/subscribe', {
                                method: 'POST',
                                headers: { 'Authorization': 'Bearer ' + token }
                            });

                            if (!res.ok) {
                                let errBody = {};
                                try { errBody = await res.json(); } catch(e) {}
                                const errMsg = errBody.details || errBody.error || ('HTTP ' + res.status);
                                throw new Error(errMsg);
                            }

                            const data = await res.json();

                            // Update modal to show success
                            const modal = overlay.querySelector('.enrollment-modal');
                            if (data.alreadyPending) {
                                modal.innerHTML = `
                                    <div class="modal-icon pending"><i class="fas fa-clock"></i></div>
                                    <h2>Request Already Sent</h2>
                                    <p>Your enrollment request is already being reviewed by the instructor. You will be notified once it's approved.</p>
                                    <div class="modal-actions">
                                        <button class="btn-close-modal" onclick="this.closest('.enrollment-modal-overlay').remove()">OK</button>
                                    </div>
                                `;
                            } else if (data.alreadyEnrolled) {
                                modal.innerHTML = `
                                    <div class="modal-icon success"><i class="fas fa-check"></i></div>
                                    <h2>Already Enrolled!</h2>
                                    <p>You already have access to this course.</p>
                                    <div class="modal-actions">
                                        <button class="btn-request" onclick="window.location.href='/course_content.html?id=${courseId}'"><i class="fas fa-arrow-right" style="margin-right:8px;"></i>Open Course</button>
                                    </div>
                                `;
                            } else {
                                modal.innerHTML = `
                                    <div class="modal-icon success"><i class="fas fa-check"></i></div>
                                    <h2>Request Sent!</h2>
                                    <p>Your enrollment request has been submitted successfully. The instructor will review it and you'll receive a notification once approved.</p>
                                    <div class="modal-actions">
                                        <button class="btn-close-modal" onclick="this.closest('.enrollment-modal-overlay').remove()">OK</button>
                                    </div>
                                `;
                            }
                        } catch (err) {
                            console.error('Enrollment request failed:', err);
                            requestBtn.disabled = false;
                            requestBtn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right:8px;"></i>Request Enrollment';
                            alert('Failed to send enrollment request: ' + err.message);
                        }
                    });
                }
            }
        });
    </script>
    <script src="js/i18n.js"></script>
</body>
</html>
