<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Viewer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #0f172a; color: #fff; overflow: hidden; }
        .viewer-container { display: flex; height: 100vh; flex-direction: column; }
        .viewer-header { 
            height: 60px; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); 
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .back-btn:hover { color: #cf9c33; }
        .header-title { font-weight: 600; font-size: 1.1rem; }
        .viewer-body { display: flex; flex: 1; overflow: hidden; }
        
        .viewer-sidebar {
            width: 300px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; overflow-y: auto; transition: 0.3s;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-title { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 5px; }
        .module-name { font-size: 1.2rem; font-weight: 700; color: #cf9c33; }
        
        .content-list { list-style: none; padding: 0; margin: 0; }
        .content-item {
            padding: 15px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer; transition: 0.2s; color: #cbd5e1;
        }
        .content-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .content-item.active { background: rgba(73, 122, 167, 0.2); border-left: 4px solid #cf9c33; color: #fff; }
        .content-icon { font-size: 1.2rem; width: 24px; text-align: center; }
        .content-text { flex: 1; font-size: 0.95rem; line-height: 1.3; }
        
        .viewer-main { flex: 1; position: relative; background: #000; display: flex; flex-direction: column; }
        .content-display { flex: 1; display: flex; align-items: center; justify-content: center; overflow-y: auto; width: 100%; }
        
        /* Specific content styles */
        .video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .video-container iframe, .video-container video { width: 100%; height: 100%; border: none; }
        
        .document-container { 
            background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
            text-align: center; max-width: 500px; width: 90%; 
        }
        .document-container i { font-size: 4rem; color: #497aa7; margin-bottom: 20px; }
        .document-container h2 { margin-top: 0; margin-bottom: 10px; }
        .btn-download {
            background: linear-gradient(135deg, #cf9c33 0%, #b38529 100%); color: white; padding: 12px 24px;
            border-radius: 8px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-top: 20px; display: inline-flex; align-items: center; gap: 10px; transition: 0.3s;
            text-decoration: none;
        }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(207, 156, 51, 0.4); }
        
        /* Quiz Interface */
        .quiz-container {
            background: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 800px;
            margin: 40px; border: 1px solid rgba(255,255,255,0.1);
        }
        .quiz-header { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 30px; }
        .quiz-header h2 { margin: 0; color: #cf9c33; }
        .question-block { margin-bottom: 30px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; }
        .question-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; margin-top: 0; }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-label {
            display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 15px;
            border-radius: 6px; cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .option-label:hover { background: rgba(255,255,255,0.1); }
        .option-label input[type="radio"] { cursor: pointer; width: 18px; height: 18px; accent-color: #cf9c33; }
        .btn-submit-quiz {
            background: #497aa7; color: white; padding: 15px 30px; border-radius: 8px; border: none;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s;
        }
        .btn-submit-quiz:hover { background: #3a6285; }
        
        .loading { display: flex; justify-content: center; align-items: center; height: 100%; font-size: 1.2rem; color: #cf9c33; }
        
        /* Quiz Result Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; padding: 40px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%; background: #0f172a; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center; border: 4px solid #cf9c33;
            font-size: 2rem; font-weight: bold; color: #cf9c33;
        }
        .modal h2 { margin-top: 0; }
        .btn-close-modal { margin-top: 20px; background: rgba(255,255,255,0.1); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="viewer-container" id="app">
        <div class="viewer-header">
            <div class="header-left">
                <button class="back-btn" id="btn-back" title="Voltar"><i class="fas fa-arrow-left"></i></button>
                <div class="header-title" id="course-title">Carregando...</div>
            </div>
        </div>
        <div class="viewer-body">
            <div class="viewer-sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">Módulo</div>
                    <div class="module-name" id="module-name">Carregando...</div>
                </div>
                <ul class="content-list" id="content-list">
                    <!-- Dynamic content list -->
                </ul>
            </div>
            <div class="viewer-main">
                <div class="content-display" id="content-display">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando conteúdo...</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="quiz-modal">
        <div class="modal-content">
            <h2>Resultado do Quiz</h2>
            <div class="score-circle" id="quiz-score">0%</div>
            <p id="quiz-feedback">Você completou o questionário!</p>
            <button class="btn-close-modal" onclick="document.getElementById('quiz-modal').classList.remove('active')">Fechar</button>
        </div>
    </div>

    <script src="module_viewer.js"></script>
</body>
</html>
