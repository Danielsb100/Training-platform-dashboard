<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Training - Students</title>
    <link rel="stylesheet" href="app.css?v=10">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .students-shell { padding: 32px 42px 52px; }
        .students-hero { background: linear-gradient(135deg, #497aa7, #cf982e); color: white; border-radius: 18px; padding: 28px 32px; box-shadow: var(--glass-shadow); display:flex; justify-content:space-between; gap:24px; align-items:flex-end; flex-wrap:wrap; }
        .students-hero h1 { margin: 0 0 8px; font-size: 2rem; }
        .students-hero p { margin: 0; opacity: .9; }
        .student-stat-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin:22px 0; }
        .student-stat-card { background:white; border:1px solid #e2e8f0; border-radius:16px; padding:18px; box-shadow:0 6px 20px rgba(15,23,42,.04); }
        .student-stat-card span { color:#64748b; font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; font-weight:800; }
        .student-stat-card strong { display:block; color:#1e293b; font-size:1.9rem; margin-top:8px; }
        .students-toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
        .students-toolbar input, .students-toolbar select { border:1px solid #cbd5e1; border-radius:999px; padding:11px 15px; background:white; color:#1e293b; min-height:42px; }
        .students-toolbar input { min-width:280px; flex:1; }
        .students-table-card { background:white; border:1px solid #e2e8f0; border-radius:18px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,.04); }
        .students-table { width:100%; border-collapse:collapse; }
        .students-table th { text-align:left; background:#f8fafc; color:#475569; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; padding:14px 16px; border-bottom:1px solid #e2e8f0; }
        .students-table td { padding:15px 16px; border-bottom:1px solid #f1f5f9; vertical-align:middle; color:#334155; }
        .students-table tr { cursor:pointer; transition:background .2s; }
        .students-table tr:hover { background:#f8fafc; }
        .student-name-cell { display:flex; align-items:center; gap:12px; min-width:230px; }
        .student-avatar { width:42px; height:42px; border-radius:50%; background:#e2e8f0; color:#497aa7; display:flex; align-items:center; justify-content:center; overflow:hidden; font-weight:800; }
        .student-avatar img { width:100%; height:100%; object-fit:cover; }
        .progress-track { height:8px; width:110px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
        .progress-fill { height:100%; background:linear-gradient(90deg,#497aa7,#cf982e); border-radius:999px; }
        .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:#f1f5f9; color:#475569; font-size:.78rem; font-weight:700; }
        .tip-preview { color:#64748b; max-width:300px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
        .empty-state { padding:54px; text-align:center; color:#64748b; }
        .students-modal { position:fixed; inset:0; background:rgba(15,23,42,.68); display:none; align-items:center; justify-content:center; padding:24px; z-index:5000; }
        .students-modal.open { display:flex; }
        .students-modal-panel { width:min(920px, 96vw); max-height:90vh; overflow:auto; background:white; border-radius:20px; box-shadow:0 24px 80px rgba(0,0,0,.25); }
        .students-modal-header { padding:24px; background:linear-gradient(135deg,#1e293b,#497aa7); color:white; display:flex; justify-content:space-between; gap:20px; align-items:start; }
        .students-modal-body { padding:24px; display:grid; gap:18px; }
        .modal-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:14px; }
        .modal-card { background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; padding:16px; }
        .modal-card label { display:block; color:#64748b; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; font-weight:800; margin-bottom:6px; }
        .module-list { display:grid; gap:10px; }
        .module-row { display:flex; justify-content:space-between; gap:12px; align-items:center; border:1px solid #e2e8f0; border-radius:12px; padding:12px 14px; }
        @media (max-width: 820px) { .students-shell { padding:20px; } .students-table-card { overflow-x:auto; } .students-table { min-width:900px; } }
    </style>
</head>

<body>
    <div class="app-container">
        <nav class="side-nav">
            <div class="nav-item" onclick="window.location.href='index.html'" title="Home"><i class="fas fa-th-large"></i></div>
            <div class="nav-item" onclick="window.location.href='profile.html?tab=subscriptions'" title="My Subscriptions"><i class="fas fa-graduation-cap"></i></div>
            <div class="nav-item" onclick="toggleNotifications(event)" title="Notifications" style="position: relative;">
                <i class="fas fa-bell"></i>
                <span class="global-nav-bell-badge" style="display:none; position:absolute; top:8px; right:8px; background:#ef4444; color:white; font-size:10px; font-weight:bold; padding:2px 5px; border-radius:10px;"></span>
            </div>
            <div class="nav-item" id="nav-creations" onclick="window.location.href='profile.html?tab=creations'" title="My Creations"><i class="fas fa-file-alt"></i></div>
            <div class="nav-item active" id="nav-students" onclick="window.location.href='students.html'" title="Students"><i class="fas fa-user-graduate"></i></div>
            <div class="nav-item" id="nav-users" onclick="window.location.href='user_management.html'" title="User Management" style="display:none;"><i class="fas fa-users"></i></div>
            <div class="nav-item" onclick="window.location.href='profile.html?tab=portfolio'" title="Portfolio"><i class="fas fa-briefcase"></i></div>
            <div class="nav-item" onclick="window.location.href='profile.html'" title="My Profile"><i class="fas fa-user"></i></div>
            <div class="nav-item" onclick="window.location.href='profile.html?tab=settings'" title="Settings"><i class="fas fa-cog"></i></div>
            <div class="nav-item logout" title="Log out"><i class="fas fa-sign-out-alt"></i></div>
        </nav>

        <div id="notification-popup" style="display:none; position:fixed; left:90px; top:120px; width:320px; background:white; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.1); border:1px solid #e2e8f0; z-index:3000; overflow:hidden;">
            <div style="padding:15px 20px; background:#f8fafc; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
                <h4 style="margin:0; color:#1e293b;">Notifications</h4>
                <span id="popup-unread-badge" style="display:none; background:#ef4444; color:white; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:bold;"></span>
            </div>
            <div id="popup-notification-list" style="max-height:300px; overflow-y:auto; padding:10px 0;">
                <div style="padding:15px; color:#64748b; text-align:center;">Loading...</div>
            </div>
        </div>

        <main class="main-content">
            <header class="top-header">
                <div class="logo"><i class="fas fa-graduation-cap"></i><span>PLATAFORMA</span></div>
                <div style="flex:1; border-left:1px solid rgba(255,255,255,0.3); margin-left:20px; padding-left:20px; font-size:14px; opacity:0.8;">Students progress dashboard</div>
                <div class="auth-buttons">
                    <a href="profile.html" class="user-avatar" id="nav-user-avatar"><i class="fas fa-user"></i></a>
                </div>
            </header>

            <section class="students-shell">
                <div class="students-hero">
                    <div>
                        <p style="font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; font-weight:800; margin-bottom:8px;">Dashboard</p>
                        <h1>Students</h1>
                        <p>Track course progress, current stage, quiz scores, and AI tips for each enrolled student.</p>
                    </div>
                    <button class="btn-primary" onclick="window.location.reload()" style="background:white; color:#1e293b;"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>

                <div class="student-stat-grid">
                    <div class="student-stat-card"><span>Courses</span><strong id="students-total-courses">-</strong></div>
                    <div class="student-stat-card"><span>Students</span><strong id="students-total-students">-</strong></div>
                    <div class="student-stat-card"><span>Avg. Progress</span><strong id="students-avg-progress">-</strong></div>
                </div>

                <div class="students-toolbar">
                    <input id="student-search" type="search" placeholder="Search by student, email, course, stage or AI tip...">
                    <select id="course-filter"><option value="all">All courses</option></select>
                    <select id="status-filter">
                        <option value="all">All statuses</option>
                        <option value="ENROLLED">Enrolled</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>

                <div class="students-table-card">
                    <table class="students-table">
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Course</th>
                                <th>Current stage</th>
                                <th>Progress</th>
                                <th>Quiz scores</th>
                                <th>AI tips</th>
                            </tr>
                        </thead>
                        <tbody id="students-table-body">
                            <tr><td colspan="6" class="empty-state">Loading students...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div class="students-modal" id="student-modal" aria-hidden="true">
        <div class="students-modal-panel">
            <div class="students-modal-header">
                <div id="student-modal-title"></div>
                <button onclick="closeStudentModal()" style="background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35); color:white; width:38px; height:38px; border-radius:50%; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div class="students-modal-body" id="student-modal-body"></div>
        </div>
    </div>

    <script src="global_notifications.js"></script>
    <script src="students.js"></script>
</body>
</html>
