<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Room — 3D World</title>
    <meta name="description" content="Choose your 3D World room to enter the immersive course environment.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-pattern {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(73, 122, 167, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(207, 152, 46, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
        }

        .container {
            position: relative; z-index: 1;
            max-width: 1200px; margin: 0 auto; padding: 40px 30px;
        }

        /* Header */
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; flex-wrap: wrap; gap: 15px;
        }

        .page-header .back-btn {
            display: flex; align-items: center; gap: 8px;
            color: #94a3b8; text-decoration: none;
            padding: 10px 20px; border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s; cursor: pointer;
            font-weight: 600; font-size: 0.9rem;
        }

        .page-header .back-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #f1f5f9;
        }

        .header-info h1 {
            font-size: 1.8rem; font-weight: 800;
            background: linear-gradient(135deg, #f1f5f9, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header-info p {
            color: #64748b; font-size: 0.9rem;
        }

        /* Room Grid */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Room Card */
        .room-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .room-card:hover {
            transform: translateY(-6px);
            border-color: rgba(207, 152, 46, 0.5);
            box-shadow:
                0 20px 40px rgba(0,0,0,0.3),
                0 0 0 1px rgba(207, 152, 46, 0.2),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .room-card.global-room {
            border-color: rgba(73, 122, 167, 0.3);
        }

        .room-card.global-room:hover {
            border-color: rgba(73, 122, 167, 0.6);
            box-shadow:
                0 20px 40px rgba(0,0,0,0.3),
                0 0 0 1px rgba(73, 122, 167, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .room-thumb {
            height: 140px;
            background: linear-gradient(135deg, #1e293b, #334155);
            position: relative;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .room-thumb img {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 0.7; transition: 0.4s;
        }

        .room-card:hover .room-thumb img {
            opacity: 1; transform: scale(1.05);
        }

        .room-thumb .room-icon {
            font-size: 3rem; color: rgba(255,255,255,0.15);
            transition: 0.3s;
        }

        .room-card:hover .room-icon {
            color: rgba(207, 152, 46, 0.4);
            transform: scale(1.1);
        }

        .room-thumb .online-badge {
            position: absolute; top: 12px; right: 12px;
            background: rgba(16, 185, 129, 0.9);
            color: white; padding: 4px 10px;
            border-radius: 20px; font-size: 0.7rem;
            font-weight: 700; backdrop-filter: blur(4px);
            display: flex; align-items: center; gap: 5px;
        }

        .online-badge .pulse {
            width: 6px; height: 6px; border-radius: 50%;
            background: #fff; animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .room-thumb .global-badge {
            position: absolute; top: 12px; left: 12px;
            background: rgba(73, 122, 167, 0.9);
            color: white; padding: 4px 10px;
            border-radius: 20px; font-size: 0.65rem;
            font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .room-body {
            padding: 20px;
        }

        .room-body h3 {
            font-size: 1.15rem; font-weight: 700;
            color: #f1f5f9; margin-bottom: 6px;
        }

        .room-body p {
            color: #64748b; font-size: 0.85rem;
            line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }

        .room-footer {
            padding: 12px 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }

        .room-footer .members {
            color: #64748b; font-size: 0.8rem;
            display: flex; align-items: center; gap: 5px;
        }

        .room-footer .enter-btn {
            background: linear-gradient(135deg, #cf982e, #b88625);
            color: white; padding: 6px 16px;
            border-radius: 8px; border: none;
            font-weight: 700; font-size: 0.8rem;
            cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .room-footer .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(207, 152, 46, 0.3);
        }

        .global-room .room-footer .enter-btn {
            background: linear-gradient(135deg, #497aa7, #3b6a94);
        }

        .global-room .room-footer .enter-btn:hover {
            box-shadow: 0 4px 15px rgba(73, 122, 167, 0.3);
        }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 80px 20px;
            color: #64748b; grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 4rem; margin-bottom: 20px;
            color: #334155;
        }

        .empty-state h3 {
            color: #94a3b8; margin-bottom: 10px;
        }

        /* Loading */
        .loading-spinner {
            display: flex; justify-content: center; align-items: center;
            padding: 80px 20px; grid-column: 1 / -1;
        }

        .loading-spinner i {
            font-size: 2rem; color: #497aa7;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .room-card { animation: fadeInUp 0.4s ease forwards; }
        .room-card:nth-child(2) { animation-delay: 0.05s; }
        .room-card:nth-child(3) { animation-delay: 0.1s; }
        .room-card:nth-child(4) { animation-delay: 0.15s; }
        .room-card:nth-child(5) { animation-delay: 0.2s; }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <div class="page-header">
            <div class="header-info">
                <h1 id="page-title"><i class="fas fa-cube"></i> Select a Room</h1>
                <p id="course-name">Loading course...</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="back-btn" id="btn-profile" onclick="window.location.href='/profile.html'" title="Go to Profile">
                    <i class="fas fa-user"></i> Profile
                </button>
                <button class="back-btn" id="btn-back" onclick="history.back()" title="Go Back">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
            </div>
        </div>

        <div class="rooms-grid" id="rooms-grid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
        </div>
    </div>

    <script src="/app-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/room_select.js?v=20260609"></script>
</body>

</html>
