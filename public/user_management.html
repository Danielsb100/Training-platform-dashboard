<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Training - Marketplace</title>
    <link rel="stylesheet" href="app.css?v=10">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">
        <!-- Floating Sidebar Nav -->
        <nav class="side-nav">
            <div class="nav-item" onclick="window.location.href='marketplace.html'" data-i18n-title="nav.home" title="Home"><i
                    class="fas fa-th-large"></i></div>
            <div class="nav-item" onclick="window.location.href='profile.html?tab=subscriptions'"
                data-i18n-title="nav.subscriptions" title="My Subscriptions"><i class="fas fa-graduation-cap"></i></div>
            <div class="nav-item" onclick="toggleNotifications(event)" data-i18n-title="nav.notifications" title="Notifications" style="position: relative;">
                <i class="fas fa-bell"></i>
                <span class="global-nav-bell-badge" style="display:none; position:absolute; top:8px; right:8px; background:#ef4444; color:white; font-size:10px; font-weight:bold; padding:2px 5px; border-radius:10px;"></span>
            </div>
            <div class="nav-item" id="nav-creations" onclick="window.location.href='profile.html?tab=creations'" data-i18n-title="nav.creations" title="My Creations" style="display:none;"><i
                    class="fas fa-file-alt"></i></div>
            <div class="nav-item" id="nav-students" onclick="window.location.href='students.html'" data-i18n-title="nav.students" title="Students" style="display:none;"><i
                    class="fas fa-user-graduate"></i></div>
            <div class="nav-item" id="nav-sync" onclick="window.location.href='profile.html?tab=sync'" data-i18n-title="nav.eurobotSync" title="Eurobot Sync" style="display:none;"><i
                    class="fas fa-sync-alt"></i></div>
            <div class="nav-item active" id="nav-users" onclick="window.location.href='user_management.html'" data-i18n-title="nav.userManagement" title="User Management" style="display:none;"><i
                    class="fas fa-users"></i></div>
            <div class="nav-item" onclick="window.location.href='profile.html?tab=portfolio'" data-i18n-title="nav.portfolio" title="Portfolio"><i
                    class="fas fa-briefcase"></i></div>
            <div class="nav-item" onclick="window.location.href='profile.html'" data-i18n-title="nav.profile" title="My Profile"><i
                    class="fas fa-user"></i></div>
            <div class="nav-item" onclick="window.location.href='profile.html?tab=settings'" data-i18n-title="nav.settings" title="Settings"><i
                    class="fas fa-cog"></i></div>
            <div class="nav-item logout" data-i18n-title="nav.logout" title="Log out"><i class="fas fa-sign-out-alt"></i></div>
        </nav>

        <!-- Notification Popup -->
        <div id="notification-popup"
            style="display:none; position:fixed; left:90px; top:120px; width:320px; background:white; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.1); border:1px solid #e2e8f0; z-index:3000; overflow:hidden;">
            <div style="padding:15px 20px; background:#f8fafc; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
                <h4 data-i18n="notifications.title" style="margin:0; color:#1e293b;">Notifications</h4>
                <span id="popup-unread-badge" style="display:none; background:#ef4444; color:white; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:bold;"></span>
            </div>
            <div id="popup-notification-list" style="max-height:300px; overflow-y:auto; padding:10px 0;">
                <div data-i18n="notifications.loading" style="padding:15px; color:#64748b; text-align:center;">Loading...</div>
            </div>
        </div>

        <script src="js/global_notifications.js"></script>

        <main class="main-content" style="position: relative;">
            <header class="top-header" style="position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #e2e8f0; background: white;">
                <div class="logo">
                    <i class="fas fa-users" style="color: #497aa7;"></i>
                    <span data-i18n="userManagement.title" style="color: #1e293b;">USER MANAGEMENT</span>
                </div>
                <div class="auth-buttons">
                    <button class="btn-outline" id="nav-login-btn" onclick="window.location.href='login.html'" data-i18n="login.loginButton" style="display:none;">LOG IN</button>
                    <a href="profile.html" class="user-avatar" id="nav-user-avatar" style="overflow: hidden; padding: 0; display: flex; align-items: center; justify-content: center; display:none;">
                        <i class="fas fa-user"></i>
                    </a>
                </div>
            </header>

            <div style="padding: 40px; max-width: 1600px; width: 95%; margin: 0 auto;">
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px;">
                    <div>
                        <h1 data-i18n="userManagement.title" style="color: #1e293b; margin: 0 0 10px 0;">Platform Users</h1>
                        <p data-i18n="userManagement.subtitle" style="color: #64748b; margin: 0;">Manage accounts, roles, and access across the platform.</p>
                    </div>
                </div>

                <div style="margin-bottom: 20px; position: relative;">
                    <i class="fas fa-search" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none;"></i>
                    <input type="text" id="user-search-input" placeholder="Search by name or email..."
                        oninput="filterUsers(this.value)"
                        style="width: 100%; padding: 12px 16px 12px 44px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: white; color: #1e293b; font-family: 'Inter', sans-serif;"
                        onfocus="this.style.borderColor='#497aa7'; this.style.boxShadow='0 0 0 3px rgba(73,122,167,0.1)';"
                        onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none';">
                </div>

                <div style="background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; text-align: left;">
                                <th data-i18n="userManagement.user" style="padding: 15px 20px; color: #475569; font-weight: 600; font-size: 14px;">User</th>
                                <th data-i18n="userManagement.email" style="padding: 15px 20px; color: #475569; font-weight: 600; font-size: 14px;">Email</th>
                                <th data-i18n="userManagement.systemRole" style="padding: 15px 20px; color: #475569; font-weight: 600; font-size: 14px;">System Role</th>
                                <th data-i18n="userManagement.assignedRole" style="padding: 15px 20px; color: #475569; font-weight: 600; font-size: 14px;">Assigned Role</th>
                                <th data-i18n="common.actions" style="padding: 15px 20px; color: #475569; font-weight: 600; font-size: 14px; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/user_management.js"></script>
    <script src="js/i18n.js"></script>
</body>

</html>
